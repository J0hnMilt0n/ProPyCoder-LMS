version: "3.8"

services:
  app:
    build: .
    container_name: propycoder-lms
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-file:./prisma/dev.db}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set_NEXTAUTH_SECRET_before_deploying}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      - ./prisma:/app/prisma
    command: sh -c "npx prisma db push --skip-generate && npm start"

  # Optional: PostgreSQL for production use
